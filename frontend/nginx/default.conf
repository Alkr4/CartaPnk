# Frontend de CartaPnk: Nginx entrega el sitio estático (HTML/CSS/JS) y reenvía /api y /media a la API (contenedor "back").
# Todo el tráfico entra por AQUÍ (mismo origen): el navegador nunca habla directo con la API, por eso no se necesita CORS
# y la cookie de sesión sigue siendo HttpOnly + SameSite=Lax.

# Protocolo original de la petición (el balanceador/Cloudflare ya lo informan en X-Forwarded-Proto; si no, el de esta conexión)
map $http_x_forwarded_proto $proto_original {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index carta.html;

  # DNS interno de Docker: si "back" aún no existe al arrancar, Nginx igualmente inicia (resuelve al primer uso)
  resolver 127.0.0.11 valid=10s ipv6=off;

  client_max_body_size 3m;        # imagen de 2 MB + campos del formulario
  client_body_timeout 15s;
  client_header_timeout 15s;
  keepalive_timeout 30s;

  # --------------------------------------------------------------- API y archivos subidos (proxy hacia el backend)
  location /api/ {
    set $api http://back:3000;
    proxy_pass $api;
    include /etc/nginx/conf.d/proxy.inc;
  }
  location /media/ {
    set $api http://back:3000;
    proxy_pass $api;
    include /etc/nginx/conf.d/proxy.inc;
  }
  # Salud para el balanceador: atraviesa el frontend y comprueba también el backend y la base de datos
  location = /salud {
    set $api http://back:3000;
    proxy_pass $api;
    include /etc/nginx/conf.d/proxy.inc;
  }
  # Salud propia de Nginx (healthcheck del contenedor)
  location = /nginx-salud {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # --------------------------------------------------------------- páginas (una por pantalla)
  location = / {
    include /etc/nginx/conf.d/seguridad.inc;
    add_header Cache-Control "no-cache" always;
    try_files /carta.html =404;
  }
  location ~ ^/restaurantes/[0-9]+/?$ {
    include /etc/nginx/conf.d/seguridad.inc;
    add_header Cache-Control "no-cache" always;
    try_files /carta.html =404;
  }
  location = /carrito {
    include /etc/nginx/conf.d/seguridad.inc;
    add_header Cache-Control "no-cache" always;
    try_files /carrito.html =404;
  }
  # Panel de administración: una sola página (las pantallas van tras el "#"); la autorización la hace la API
  location ~ ^/admin/?$ {
    include /etc/nginx/conf.d/seguridad.inc;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files /admin.html =404;
  }

  # --------------------------------------------------------------- archivos estáticos
  # CSS y JS se revalidan siempre (ETag): un despliegue nuevo se ve de inmediato, sin versionar los nombres.
  location ~ ^/(css|js)/ {
    include /etc/nginx/conf.d/seguridad.inc;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }
  # Imágenes y librerías cambian poco: caché de 7 días
  location ~ ^/(img|imagenes|vendors)/ {
    include /etc/nginx/conf.d/seguridad.inc;
    add_header Cache-Control "public, max-age=604800" always;
    try_files $uri =404;
  }

  # --------------------------------------------------------------- todo lo demás
  error_page 404 /404.html;
  location = /404.html {
    internal;
    include /etc/nginx/conf.d/seguridad.inc;
  }
  location / {
    return 404;
  }
}
