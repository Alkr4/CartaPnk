# Integración continua en GitHub: se ejecuta en cada push y Pull Request hacia develop o main.
# El trabajo "calidad" es el chequeo que se marca como obligatorio en la protección de la rama main.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  calidad:
    name: calidad
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pnk_test
          POSTGRES_USER: pnk
          POSTGRES_PASSWORD: pnk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pnk -d pnk_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      APP_ENV: test
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: pnk_test
      DB_USER: pnk
      DB_PASSWORD: pnk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Lint (ESLint + eslint-plugin-security)
        run: npm run lint

      - name: Pruebas (Jest + Supertest)
        run: npm test

      - name: Auditoría de dependencias de producción
        run: npm run audit:deps

  # Valida la infraestructura como código: plantilla de CloudFormation y scripts de shell.
  infraestructura:
    name: infraestructura
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar cfn-lint
        run: pip install cfn-lint

      - name: Validar la plantilla de CloudFormation
        run: cfn-lint infra/pnk-stack.yaml

      - name: ShellCheck de los scripts (informativo)
        continue-on-error: true
        run: shellcheck -x scripts/desplegar.sh tools/mostrar-ambientes.sh backend/docker/entrypoint.sh

  # Frontend: pruebas con jsdom (sin base de datos) y validación de la configuración de Nginx dentro de su imagen.
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Pruebas del frontend (jsdom)
        run: npm test

      - name: Construir la imagen de Nginx y validar su configuración
        run: |
          docker build -t cartapnk-front .
          docker run --rm cartapnk-front nginx -t
