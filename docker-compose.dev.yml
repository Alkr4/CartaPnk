# AMBIENTE DE DESARROLLO — recarga automática, base de datos accesible desde el equipo (puerto 5432 sólo en localhost).
services:
  db:
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"

  back:
    build:
      target: desarrollo
    ports:
      - "127.0.0.1:${BACK_PORT:-3100}:3000" # API directa, sólo para depurar con curl/Postman
    volumes:
      # el código se monta como volumen: al guardar un archivo, nodemon reinicia la app
      - ./backend/src:/app/src
      - ./backend/db:/app/db

  front:
    ports:
      - "${APP_PORT:-3000}:8080" # cambie APP_PORT en env/dev.env si 3000 está ocupado (p. ej. por producción en el mismo servidor)
    volumes:
      # los archivos del sitio se montan: al guardar un HTML/CSS/JS basta recargar el navegador
      - ./frontend/public:/usr/share/nginx/html:ro
