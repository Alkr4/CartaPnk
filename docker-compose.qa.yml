# AMBIENTE DE QA — imagen idéntica a la de producción (target "produccion") + contenedor de pruebas automáticas.
#
#   npm run docker:qa      construye, ejecuta lint + pruebas + auditoría y termina con el código de salida de las pruebas
#   npm run docker:qa:app  deja sólo la app y su base disponibles en http://localhost:3001 para pruebas manuales/ZAP
services:
  db:
    volumes:
      # crea además la base "pnk_test" que usan las pruebas automáticas (sólo en el primer arranque del volumen)
      - ./backend/docker/db-init:/docker-entrypoint-initdb.d:ro

  app:
    ports:
      - "3001:3000"

  pruebas:
    build:
      context: ./backend
      target: pruebas
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: test
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: pnk_test
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
